<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d18"><title>Spin Twins</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#182746,#090d18 62%);color:#f4f7ff;font-family:system-ui,-apple-system,Arial;touch-action:manipulation}#app{height:100dvh;max-width:620px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);gap:8px}header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px}h1{font-size:20px;letter-spacing:2px;margin:0;font-weight:900}h1 span{color:#62e7ff}button{cursor:pointer}#sound{border:1px solid #263652;background:#15233a;color:white;border-radius:22px;padding:9px 13px;font-weight:700}#stage{position:relative;flex:1;min-height:250px;display:grid;place-items:center}canvas{width:min(92vw,560px);height:min(92vw,560px);max-height:100%;aspect-ratio:1;display:block}#hud{position:absolute;top:5px;left:50%;transform:translateX(-50%);display:flex;gap:8px;white-space:nowrap}.pill{background:#111b2ddd;border:1px solid #2b3b59;border-radius:18px;padding:6px 11px;font-size:12px;font-weight:800}#overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}#message{display:none;text-align:center;pointer-events:auto;background:#0b1224ef;border:1px solid #50617f;border-radius:18px;padding:18px 24px}#message strong{display:block;font-size:26px;color:#ff69b4}#message small{color:#b9c8df}.controls{background:#111a2c;border:1px solid #263652;border-radius:20px;padding:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.speedbox{display:flex;align-items:center;gap:8px}.speedbox button,.action{border:1px solid #3a5073;background:#1a2b46;color:white;border-radius:13px;padding:10px 13px;font-weight:900;font-size:17px}#speedVal{font-size:13px;font-weight:800;min-width:54px;text-align:center}#start{background:linear-gradient(135deg,#27c9e8,#507bff);border:0;color:#071323;border-radius:14px;padding:12px 18px;font-weight:950}#reset{font-size:12px;padding:10px}footer{text-align:center;font-size:12px;color:#91a2bd;padding:0 0 8px}footer a{color:#ff83bd;text-decoration:none;font-weight:800}@media(max-height:650px){header{padding:2px}h1{font-size:17px}.controls{padding:8px}footer{padding-bottom:2px}}
</style></head><body><div id="app"><header><h1>⚔️ <span>SPIN</span> TWINS</h1><button id="sound">🔊 SOUND ON</button></header><div id="stage"><canvas id="game" width="720" height="720"></canvas><div id="hud"><div class="pill">BALLS <span id="count">1</span></div><div class="pill">GOAL 200K</div></div><div id="overlay"><div id="message"><strong>ARENA BROKEN!</strong><small>200,000 balls reached</small><br><button class="action" id="again">PLAY AGAIN</button></div></div></div><div class="controls"><div class="speedbox"><button id="minus">−</button><span id="speedVal">1.0×</span><button id="plus">+</button></div><button id="start">▶ START</button><button class="action" id="reset">↻ RESET</button></div><footer>Made to spin • <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a></footer></div>
<script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),C=360,R=292,G=200000,$=id=>document.getElementById(id);let balls=[],count=1,run=false,broken=false,speed=1,angle=0,last=0,raf=0,sound=true,audio=null;
function ac(){if(!audio){let A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==='suspended')audio.resume()}
function tone(f,d=.08,type='sine',v=.035,slide=0){if(!sound)return;ac();if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),audio.currentTime+d);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function noise(){if(!sound)return;ac();if(!audio)return;let n=audio.sampleRate*.65,b=audio.createBuffer(1,n,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);let s=audio.createBufferSource(),g=audio.createGain();s.buffer=b;g.gain.value=.1;s.connect(g);g.connect(audio.destination);s.start()}
function splitSound(){tone(520,.07,'triangle',.04,240);setTimeout(()=>tone(760,.08,'sine',.025,-180),35)}
function reset(){balls=[{x:C,y:C-120,vx:1.7,vy:1.3,r:5,h:190}];count=1;angle=0;broken=false;run=false;last=0;$('count').textContent='1';$('message').style.display='none';$('start').textContent='▶ START';draw()}
function add(b){if(count>=G)return;count=Math.min(G,count+1);if(balls.length<1600){let a=Math.random()*Math.PI*2,s=1.1+Math.random()*1.7;balls.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:4+Math.random()*1.5,h:Math.random()*360})}$('count').textContent=count.toLocaleString('en-US')}
function swords(){for(let i=0;i<2;i++){x.save();x.translate(C,C);x.rotate(angle+i*Math.PI);x.shadowBlur=18;x.shadowColor=i?'#ff69b4':'#62e7ff';x.lineCap='round';x.lineWidth=13;x.strokeStyle=i?'#ff69b4':'#62e7ff';x.beginPath();x.moveTo(0,0);x.lineTo(R*.56,0);x.stroke();x.lineWidth=3;x.strokeStyle='white';x.beginPath();x.moveTo(14,0);x.lineTo(R*.56-4,0);x.stroke();x.fillStyle='#eafaff';x.beginPath();x.arc(0,0,11,0,Math.PI*2);x.fill();x.restore()}}
function draw(){x.clearRect(0,0,720,720);let g=x.createRadialGradient(C,C,30,C,C,R+20);g.addColorStop(0,'#14223b');g.addColorStop(1,'#0b1425');x.fillStyle=g;x.beginPath();x.arc(C,C,R,0,7);x.fill();x.save();x.beginPath();x.arc(C,C,R-4,0,7);x.clip();for(let b of balls){x.fillStyle=`hsl(${b.h},95%,68%)`;x.shadowBlur=8;x.shadowColor=x.fillStyle;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}x.shadowBlur=0;x.restore();x.lineWidth=broken?3:10;x.strokeStyle=broken?'#ff5577':'#a5b8d7';x.shadowBlur=broken?20:10;x.shadowColor=broken?'#ff5577':'#8bb8ff';x.beginPath();x.arc(C,C,R,0,7);x.stroke();x.shadowBlur=0;if(!broken)swords();else{for(let i=0;i<14;i++){let a=i*Math.PI/7;x.beginPath();x.moveTo(C+Math.cos(a)*(R-8),C+Math.sin(a)*(R-8));x.lineTo(C+Math.cos(a)*(R+28),C+Math.sin(a)*(R+28));x.stroke()}}}
function update(dt){if(!run||broken)return;angle+=dt*1.5*speed;for(let b of balls){b.x+=b.vx*dt*60;b.y+=b.vy*dt*60;let dx=b.x-C,dy=b.y-C,d=Math.hypot(dx,dy);if(d>R-b.r){let nx=dx/(d||1),ny=dy/(d||1);b.x=C+nx*(R-b.r);b.y=C+ny*(R-b.r);let dot=b.vx*nx+b.vy*ny;b.vx-=2*dot*nx;b.vy-=2*dot*ny}for(let s=0;s<2;s++){let a=angle+s*Math.PI,ux=Math.cos(a),uy=Math.sin(a),px=b.x-C,py=b.y-C,t=Math.max(8,Math.min(R*.56,px*ux+py*uy)),dist=Math.hypot(px-ux*t,py-uy*t);if(dist<b.r+7&&Math.random()<.06){let old={x:b.x,y:b.y},side=Math.random()>.5?1:-1;b.vx+=-uy*side*.8;b.vy+=ux*side*.8;add(old);splitSound();break}}}if(count>=G){count=G;$('count').textContent='200,000';broken=true;run=false;$('message').style.display='block';noise();tone(90,.7,'sawtooth',.07,-55);$('start').textContent='▶ START'}}
function loop(t){if(!last)last=t;let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();if(run)raf=requestAnimationFrame(loop)}
$('start').onclick=()=>{ac();if(broken)return;if(!run){run=true;$('start').textContent='Ⅱ PAUSE';last=0;raf=requestAnimationFrame(loop)}else{run=false;cancelAnimationFrame(raf);$('start').textContent='▶ RESUME'}tone(420,.06,'square',.025,100)};
$('reset').onclick=()=>{reset();tone(330)};$('again').onclick=()=>{reset();$('start').click()};
$('plus').onclick=()=>{speed=Math.min(4,speed+.2);$('speedVal').textContent=speed.toFixed(1)+'×';tone(650,.06,'triangle')};$('minus').onclick=()=>{speed=Math.max(.2,speed-.2);$('speedVal').textContent=speed.toFixed(1)+'×';tone(360,.06,'triangle')};
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 SOUND ON':'🔇 SOUND OFF';if(sound){ac();tone(660,.1)}};c.addEventListener('pointerdown',()=>{ac()});reset()})();
</script></body></html>
